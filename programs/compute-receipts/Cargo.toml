[package]
name = "compute-receipts"
version = "0.1.0"
description = "SolGrid Compute Receipts — on-chain receipt storage and verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "compute_receipts"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
