[package]
name = "provider-registry"
version = "0.1.0"
description = "SolGrid Provider Registry — on-chain GPU provider registration"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "provider_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
