syntax = "proto3";
package solgrid.scheduler;

// Scheduler API messages for job management and coordination.

message CreateJobRequest {
  string client_pubkey = 1;
  string gpu_class = 2;
  uint32 gpu_count = 3;
  uint32 max_duration_sec = 4;
  uint64 budget_scu = 5;
}

message JobAssignment {
  string job_id = 1;
  string provider_id = 2;
  string provider_pubkey = 3;
  string gpu_class = 4;
  uint32 gpu_count = 5;
  uint32 max_duration_sec = 6;
  uint64 budget_scu = 7;
}

message TxRequest {
  TxType tx_type = 1;
  string reference_id = 2;
  string payload_json = 3;
}

message TxResult {
  string tx_hash = 1;
  TxType tx_type = 2;
  string reference_id = 3;
  bool success = 4;
  string error = 5;
}

enum TxType {
  TX_TYPE_UNSPECIFIED = 0;
  TX_TYPE_REGISTER_PROVIDER = 1;
  TX_TYPE_CREATE_ESCROW = 2;
  TX_TYPE_SUBMIT_RECEIPT = 3;
  TX_TYPE_RELEASE_ESCROW = 4;
  TX_TYPE_REFUND_ESCROW = 5;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_ASSIGNED = 2;
  JOB_STATUS_COMPUTING = 3;
  JOB_STATUS_RECEIPT_SUBMITTED = 4;
  JOB_STATUS_VERIFIED = 5;
  JOB_STATUS_SETTLED = 6;
  JOB_STATUS_FAILED = 7;
}

message DashboardStats {
  int64 total_providers = 1;
  int64 active_providers = 2;
  int64 total_jobs = 3;
  int64 active_jobs = 4;
  int64 settled_jobs = 5;
  int64 total_scu_settled = 6;
  int64 total_receipts = 7;
  int64 verified_receipts = 8;
}

message GpuTelemetry {
  string provider_pubkey = 1;
  string job_id = 2;
  uint32 gpu_index = 3;
  float utilization_pct = 4;
  uint32 memory_used_mb = 5;
  uint32 memory_total_mb = 6;
  uint32 temperature_c = 7;
  uint32 power_draw_w = 8;
  string timestamp = 9;
}
